name: myKairn SciWatch CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-lint:
    name: Tests & Qualité (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate built-in YAML Topic Profiles
        run: |
          PYTHONPATH=src python -m mykairn_sciwatch profile list

      - name: Run Unit & Integration Test Suite
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -v
