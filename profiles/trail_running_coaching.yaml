slug: trail_running_coaching
name: "Coaching & Accompagnement d'Athlètes Tous Niveaux en Trail Running"
description: >
  Veille et audit scientifique multi-sources sur l'entraînement, l'accompagnement,
  la physiologie, la biomécanique, la nutrition, la récupération, la psychologie
  et la prévention des blessures en trail running, course en montagne et ultra-trail,
  du coureur débutant/récréatif à l'athlète élite.
domain: sports_science
language: fr
audit_start_year: 2015
watch_lookback_days: 30
max_results_per_source: 40
min_relevance_score: 14.0

queries:
  - '("trail running" OR "ultra-trail" OR "ultratrail" OR "mountain running") AND (training OR coaching OR performance OR physiology OR pacing)'
  - '("trail running" OR "ultra-endurance running" OR "ultramarathon") AND (nutrition OR hydration OR carbohydrate OR gastrointestinal)'
  - '("trail running" OR "downhill running" OR "graded running") AND (biomechanics OR muscular damage OR fatigue OR poles OR economy)'
  - '("trail running" OR "ultramarathon" OR "endurance running") AND (injury prevention OR recovery OR sleep OR heart rate variability OR training load)'
  - '("trail runner" OR "trail runners" OR "ultra-marathon") AND (recreational OR amateur OR elite OR female OR master)'

inclusion_keywords:
  - trail running
  - trail runner
  - trail runners
  - ultra-trail
  - ultratrail
  - ultramarathon
  - ultra-marathon
  - mountain running
  - downhill running
  - uphill running
  - graded running
  - skyrunning
  - endurance running
  - running economy
  - training load
  - periodization

exclusion_keywords:
  - mouse
  - mice
  - rat
  - rats
  - equine
  - horse
  - canine
  - retracted
  - corrigendum

high_impact_journals:
  - "Sports Medicine"
  - "British Journal of Sports Medicine"
  - "International Journal of Sports Physiology and Performance"
  - "Journal of Applied Physiology"
  - "Medicine & Science in Sports & Exercise"
  - "Medicine and Science in Sports and Exercise"
  - "European Journal of Sport Science"
  - "Scandinavian Journal of Medicine & Science in Sports"
  - "Journal of Sports Sciences"
  - "Journal of Strength and Conditioning Research"
  - "Frontiers in Physiology"
  - "Frontiers in Sports and Active Living"
  - "Journal of the International Society of Sports Nutrition"
  - "Nutrients"
  - "PLOS ONE"

rss_feeds:
  - name: "IJSPP (Human Kinetics)"
    url: "https://journals.humankinetics.com/rss/showFeed?ui=0&mi=3fndc3&ai=s8&jc=ijspp&type=etoc&feed=rss"
  - name: "Frontiers in Sports and Active Living"
    url: "https://www.frontiersin.org/journals/sports-and-active-living/rss"

themes:
  - slug: periodization_training_load
    name: "Périodisation, Charge d'Entraînement & Programmation"
    description: "Distribution d'intensité (polarisé, pyramidal), quantification de la charge (TRIMP, RPE, D+), affûtage (tapering) et individualisation."
    weight: 1.3
